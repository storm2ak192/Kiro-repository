name: Kiro Universal Extension Builder

on:
  push:
    paths:
      - 'src/ar/animewitcher/**'
  workflow_dispatch:
    inputs:
      extension:
        description: 'Extension to build (example: ar/anime3rb) or all'
        required: true
        default: 'ar/animewitcher'
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Extensions
    runs-on: ubuntu-latest

    env:
      CI: "false"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Selected Extension
        env:
          EXTENSION: ${{ inputs.extension || 'ar/animewitcher' }}
        run: |
          chmod +x gradlew

          if [ "$EXTENSION" = "all" ]; then
            echo "Building all extensions..."
            ./gradlew assembleDebug --stacktrace
          else
            if [[ ! "$EXTENSION" =~ ^[a-z0-9_-]+/[a-z0-9_-]+$ ]]; then
              echo "Invalid extension format."
              exit 1
            fi

            LANGUAGE="${EXTENSION%%/*}"
            NAME="${EXTENSION##*/}"

            echo "Building: $LANGUAGE/$NAME"

            ./gradlew ":src:${LANGUAGE}:${NAME}:assembleDebug" --stacktrace
          fi

      - name: Upload APK Files
        uses: actions/upload-artifact@v4
        with:
          name: Kiro-Extensions-APK
          path: src/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
